name: PL-SQL Trigger Autograding

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  autograding:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Repository Structure
        run: |
          echo "Repository files:"
          find . -maxdepth 4 -type f | sort

      - name: Find and Run Test
        run: |
          echo "Searching for test.sh..."

          TEST_FILE=$(find . -name "test.sh" -type f | head -n 1)

          if [ -z "$TEST_FILE" ]; then
            echo "ERROR: test.sh not found"
            exit 1
          fi

          echo "Found test file:"
          echo "$TEST_FILE"

          chmod +x "$TEST_FILE"

          TEST_DIR=$(dirname "$TEST_FILE")

          cd "$TEST_DIR"

          ./test.sh
